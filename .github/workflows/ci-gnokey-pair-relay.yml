name: ci / gnokey-pair relay

# The contribs matrix (ci-dir-contribs.yml) has no Python venv, so the
# gnokey-pair tests that need the reference mailbox server skip there: the
# wormhole tests and the end-to-end test. This workflow runs them, also when
# gnokey changes, since the end-to-end test drives the real gnokey.

on:
  push:
    branches:
      - master
    paths:
      - contribs/gnokey-pair/**
      - gno.land/cmd/gnokey/**
      - tm2/pkg/crypto/keys/client/**
      - .github/workflows/ci-gnokey-pair-relay.yml
  pull_request:
    paths:
      - contribs/gnokey-pair/**
      - gno.land/cmd/gnokey/**
      - tm2/pkg/crypto/keys/client/**
      - .github/workflows/ci-gnokey-pair-relay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: wormhole and end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: contribs/gnokey-pair/go.mod
          cache-dependency-path: contribs/gnokey-pair/go.sum
      - name: Test against the reference relay
        working-directory: contribs/gnokey-pair
        run: make test-relay
